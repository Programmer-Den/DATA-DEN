#!/usr/sbin/nft -f
# Firewall of the storage VM; setup-firewall.sh fills in the Pi's address.
# Only the Pi gets in, the VM may connect out.

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		iif lo accept
		ct state established,related accept
		ct state invalid drop

		# The Pi: HTTPS for DATA-DEN (8443), SSH for maintenance, ping.
		ip saddr @PI_ADDRESS@ tcp dport { 22, 8443 } accept
		ip saddr @PI_ADDRESS@ icmp type echo-request accept

		# The router's DHCP answers and what IPv6 needs to find its neighbours.
		udp sport 67 udp dport 68 accept
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
