name: PR Links

# Reusable: fails a pull request whose title, description, commit messages or
# comments link anywhere but GitHub and the owner's GitHub Pages site, or name
# a person by a name listed in the FORBIDDEN_NAMES secret (people appear only
# by their GitHub username).
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, such as '"ubuntu-latest"' or '["self-hosted", "light"]'
        type: string
        default: '"ubuntu-latest"'
    secrets:
      FORBIDDEN_NAMES:
        description: Names that must never appear, one per line, such as a real first and last name
        required: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  github-links-only:
    # Dependabot's descriptions and commit messages link to the release notes
    # of each dependency.
    # Skipping the job still reports the check as passed. A comment on an issue
    # that is not a pull request is not checked.
    if: >-
      (github.event.pull_request.user.login || github.event.issue.user.login) != 'dependabot[bot]' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - name: Check PR title, description, commit messages and comments link only to GitHub
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The texts are read as data from the API; they never reach a shell. The
            // PR is fetched fresh, as a re-run of an older run would otherwise
            // check the title and description it started with.
            const pull_number = (context.payload.pull_request ?? context.payload.issue).number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number });
            const body = pr.body || '';
            // What GitHub turns into a link: a URL with a scheme, or one starting with www.
            const link = /\b(?:[a-z][a-z0-9+.-]*:\/\/|www\.)[^\s<>()[\]"'`]+/gi;
            const host = (url) => {
              try {
                return new URL(/^www\./i.test(url) ? `https://${url}` : url).hostname.toLowerCase();
              } catch {
                return '';
              }
            };
            // The owner's GitHub Pages site, for demos and docs.
            const pages = `${context.repo.owner.toLowerCase()}.github.io`;
            const onGitHub = (h) =>
              h === 'github.com' || h.endsWith('.github.com') || h.endsWith('.githubusercontent.com') ||
              h === pages;

            const linksOutside = (text, where) =>
              text.split(/\r?\n/).flatMap((line, i) =>
                [...line.matchAll(link)]
                  .map(m => m[0])
                  .filter(url => !onGitHub(host(url)))
                  .map(url => `${where}, line ${i + 1}: ${url}`));

            const everyPage = (list, params) => github.paginate(list, { ...context.repo, ...params, per_page: 100 });
            const commits = await everyPage(github.rest.pulls.listCommits, { pull_number });
            // The comments, the reviews and the comments on lines of the diff.
            const comments = await everyPage(github.rest.issues.listComments, { issue_number: pull_number });
            const reviews = await everyPage(github.rest.pulls.listReviews, { pull_number });
            const reviewComments = await everyPage(github.rest.pulls.listReviewComments, { pull_number });
            const hits = [
              ...linksOutside(pr.title, 'title'),
              ...linksOutside(body, 'description'),
              ...commits.flatMap(c => linksOutside(c.commit.message, `commit ${c.sha.slice(0, 7)}`)),
              ...comments.flatMap(c => linksOutside(c.body || '', `comment ${c.html_url}`)),
              ...reviews.flatMap(r => linksOutside(r.body || '', `review ${r.html_url}`)),
              ...reviewComments.flatMap(c => linksOutside(c.body || '', `review comment ${c.html_url}`))
            ];

            if (hits.length > 0) {
              core.setFailed(`PR links outside GitHub; edit the title, description or comment, or reword the commits and the check re-runs:\n${hits.join('\n')}`);
            } else {
              console.log(`PR title, description, ${commits.length} commit message(s), ${comments.length} comment(s), ${reviews.length} review(s) and ${reviewComments.length} review comment(s) link only to GitHub.`);
            }

  no-real-names:
    # The names live in a secret, so the list itself is never published. Fork
    # and Dependabot PRs get no secrets; for them the check says so and passes.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - name: Check PR title, description, commits and comments name people only by username
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FORBIDDEN_NAMES: ${{ secrets.FORBIDDEN_NAMES }}
        with:
          script: |
            const names = (process.env.FORBIDDEN_NAMES || '')
              .split(/\r?\n/).map(n => n.trim().toLowerCase()).filter(Boolean);
            if (names.length === 0) {
              core.notice('FORBIDDEN_NAMES is not set or not available to this run; names are not checked.');
              return;
            }
            // The texts are read as data from the API; they never reach a shell.
            const pull_number = (context.payload.pull_request ?? context.payload.issue).number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number });
            const everyPage = (list, params) => github.paginate(list, { ...context.repo, ...params, per_page: 100 });
            const commits = await everyPage(github.rest.pulls.listCommits, { pull_number });
            const comments = await everyPage(github.rest.issues.listComments, { issue_number: pull_number });
            const reviews = await everyPage(github.rest.pulls.listReviews, { pull_number });
            const reviewComments = await everyPage(github.rest.pulls.listReviewComments, { pull_number });

            // Only where a name was found is reported, never the name: the log is
            // public in a public repository.
            const places = [
              ['title', pr.title],
              ['description', pr.body || ''],
              ...commits.flatMap(c => [
                [`commit ${c.sha.slice(0, 7)} message`, c.commit.message],
                [`commit ${c.sha.slice(0, 7)} author`, `${c.commit.author?.name} ${c.commit.author?.email}`],
                [`commit ${c.sha.slice(0, 7)} committer`, `${c.commit.committer?.name} ${c.commit.committer?.email}`]
              ]),
              ...comments.map(c => [`comment ${c.html_url}`, c.body || '']),
              ...reviews.map(r => [`review ${r.html_url}`, r.body || '']),
              ...reviewComments.map(c => [`review comment ${c.html_url}`, c.body || ''])
            ];
            const hits = places
              .filter(([, text]) => names.some(name => (text || '').toLowerCase().includes(name)))
              .map(([where]) => where);

            if (hits.length > 0) {
              core.setFailed(`A name from FORBIDDEN_NAMES appears in the PR; use the GitHub username instead. Edit the text, or reword or re-author the commits (git config user.name <username>, user.email <id>+<username>@users.noreply.github.com):\n${hits.join('\n')}`);
            } else {
              console.log(`No listed name in the title, description, ${commits.length} commit(s), ${comments.length} comment(s), ${reviews.length} review(s) and ${reviewComments.length} review comment(s).`);
            }
