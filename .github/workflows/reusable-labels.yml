name: Labels

# Reusable: keeps the repository's labels in line with .github/labels.json:
# creates or updates every label listed there and deletes every label that isn't.
# A label's group (Change, Area, Priority, Status) is the start of its
# description. "previous" is a label's old name, so a rename keeps it on its
# issues and PRs.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, such as '"ubuntu-latest"' or '["self-hosted", "light"]'
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync the labels with .github/labels.json
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const wanted = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...context.repo,
              per_page: 100
            });
            const byName = new Map(existing.map(l => [l.name.toLowerCase(), l]));
            const handled = new Set();
            for (const { name, color, description, previous } of wanted) {
              // "previous" is a label's old name, so a rename keeps it on its issues and PRs.
              const current = byName.get(name.toLowerCase()) ||
                (previous && byName.get(previous.toLowerCase()));
              if (!current) {
                await github.rest.issues.createLabel({ ...context.repo, name, color, description });
                console.log(`Created ${name}`);
                continue;
              }
              handled.add(current.id);
              if (current.name !== name || current.color !== color ||
                  (current.description || '') !== description) {
                await github.rest.issues.updateLabel({
                  ...context.repo,
                  name: current.name,
                  new_name: name,
                  color,
                  description
                });
                console.log(`Updated ${current.name} -> ${name}`);
              }
            }
            for (const label of existing) {
              if (!handled.has(label.id)) {
                await github.rest.issues.deleteLabel({ ...context.repo, name: label.name });
                console.log(`Deleted ${label.name}`);
              }
            }
