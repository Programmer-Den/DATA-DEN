version: 2
# Every update gets a "Change" and an "Area" label (.github/labels.json).
updates:
  # Keep the actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies, repo]
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /backend
    labels: [dependencies, server]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    labels: [dependencies, ui]
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
  - package-ecosystem: docker
    directory: /
    labels: [dependencies, install]
    schedule:
      interval: weekly
