version: 2
# Every update gets a "Change" and an "Area" label (.github/labels.json).
updates:
  # Keep the actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies, repo]
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # Add the ecosystems of this repository, for example:
